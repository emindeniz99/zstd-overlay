name: release

# A tag v* gets a GitHub Release with the environment's setup script for that
# commit attached: the file to paste into a Claude Code cloud environment.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # release-please dispatches it from main for the new tag
    inputs:
      tag:
        description: "the release tag (v*) to build the scripts for"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: build the setup script and publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: resolve the tag and its commit
        # The fetch runs without credentials (persist-credentials is off); it works because
        # the repository is public.
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in v*) ;; *) echo "not a release tag: '${TAG}' (pass tag=v...)" >&2; exit 1 ;; esac
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          COMMIT=$(git rev-list -n 1 "${TAG}")
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "COMMIT=${COMMIT}" >> "$GITHUB_ENV"
          echo "building for ${TAG} at ${COMMIT}"
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
      - name: build the setup scripts for that commit
        run: |
          ./build-setup-script.sh "${COMMIT}" > setup-script.sh
          ./build-setup-script.sh --embed "${COMMIT}" > setup-script-embedded.sh
          sha256sum setup-script.sh setup-script-embedded.sh > SHA256SUMS
      - name: the download form really installs that commit
        run: |
          sudo bash setup-script.sh
          sudo /usr/local/bin/zstd-overlay version | tee version.txt
          grep -q "commit ${COMMIT:0:7}," version.txt
      - name: publish the release, or add the files to one made by hand
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" setup-script.sh setup-script-embedded.sh SHA256SUMS --clobber
          else
            gh release create "${TAG}" setup-script.sh setup-script-embedded.sh SHA256SUMS \
              --title "${TAG}" \
              --notes "Paste \`setup-script.sh\` into a Claude Code cloud environment's setup script. It downloads \`zstd-overlay\` at commit ${COMMIT:0:7} and checks its SHA-256 before installing. \`setup-script-embedded.sh\` carries the tool itself, for an environment that cannot reach github.com."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
